<!DOCTYPE html>
<html lang="en" class="no-zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metal Lab · Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E4F4F0; --tile:#CFE8E2; --paper:#FFFFFF; --paper-2:#F3FAF8;
  --ink:#17414A; --ink-soft:#4E6E74; --line:#B9DCD4; --line-strong:#17414A;
  --tape:#FFC93C; --tape-ink:#3B2A05; --coral:#FF6F61; --mint:#2EC4A6;
  --good:#1E9E72; --good-bg:#DDF5EA; --bad:#D9483F; --bad-bg:#FDE3E0;
  --copper:#C8693F; --alu:#AEBBC7; --steel:#5E6B7A;
  --scene-wall:#D7EFEA; --scene-tile:#C3E3DC; --scene-sky:#BFE7FF; --scene-frame:#FFFFFF;
  --scene-wood:#E9B97A; --scene-bench:#3E7C86; --scene-bench-top:#9ED8CF; --scene-sign:#17414A;
  --bubble:#FFFFFF; --shadow:#17414A;
  --font-display:'Fredoka','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0E2A2F; --tile:#143840; --paper:#173B42; --paper-2:#12333A;
    --ink:#E6F7F3; --ink-soft:#9DC4C0; --line:#2B5A62; --line-strong:#8FD3C6;
    --good:#5FD9A8; --good-bg:#16463A; --bad:#FF8A80; --bad-bg:#4A2522;
    --scene-wall:#163C44; --scene-tile:#1C4851; --scene-sky:#27476B; --scene-frame:#2B5A62;
    --scene-wood:#9A6C3C; --scene-bench:#245760; --scene-bench-top:#3E8C83; --scene-sign:#0B2226;
    --bubble:#21484F; --shadow:#071A1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0E2A2F; --tile:#143840; --paper:#173B42; --paper-2:#12333A;
  --ink:#E6F7F3; --ink-soft:#9DC4C0; --line:#2B5A62; --line-strong:#8FD3C6;
  --good:#5FD9A8; --good-bg:#16463A; --bad:#FF8A80; --bad-bg:#4A2522;
  --scene-wall:#163C44; --scene-tile:#1C4851; --scene-sky:#27476B; --scene-frame:#2B5A62;
  --scene-wood:#9A6C3C; --scene-bench:#245760; --scene-bench-top:#3E8C83; --scene-sign:#0B2226;
  --bubble:#21484F; --shadow:#071A1D;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%;
  background-color:var(--wall);
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);
  background-size:34px 34px;
  color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0}
p{margin:0 0 .8em}
.zh{color:var(--ink-soft);font-size:.86em;font-weight:400}
html.no-zh .zh{display:none!important}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.zh-fab{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:42%;z-index:30;border:2px solid var(--line-strong);background:var(--paper);color:var(--ink);font-family:var(--font-body);font-weight:700;font-size:14px;line-height:1.2;padding:8px 10px;border-radius:12px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap;opacity:.85}
.zh-fab:hover{opacity:1}
.zh-fab[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);opacity:1}
@media (max-width:640px){.zh-fab{font-size:12px;padding:6px 8px;right:calc(4px + env(safe-area-inset-right,0px))}}

/* ---------- top bar ---------- */
.app{max-width:1080px;margin:0 auto;padding:14px 16px 190px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand svg{width:38px;height:38px;flex:none}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-soft);letter-spacing:0}
.map{display:flex;align-items:center;gap:0;margin:0 auto;padding:0;list-style:none}
.map li{display:flex;align-items:center}
.map .stop{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-soft);min-width:52px}
.map .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-size:15px}
.map .bar{width:22px;height:3px;background:var(--line);border-radius:2px;margin-bottom:16px}
.map .done .dot{background:var(--mint);border-color:var(--mint)}
.map .done + .bar,.map li.done .bar{background:var(--mint)}
.map .now .dot{background:var(--tape);border-color:var(--line-strong);transform:scale(1.12)}
.map .now{color:var(--ink);font-weight:700}
.tools{display:flex;gap:8px}
.tool{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.tool[aria-pressed="false"]{opacity:.6}

/* ---------- shared pieces ---------- */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 5px 0 var(--line);margin-bottom:20px}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--font-display);font-weight:600;font-size:15px;padding:4px 14px 5px;border-radius:4px;transform:rotate(-1.6deg);margin-bottom:10px;box-shadow:0 2px 0 #0000001a}
.title-xl{font-size:clamp(30px,5.4vw,50px);font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.title-l{font-size:clamp(23px,3.6vw,32px);margin-bottom:6px}
.lead{font-size:clamp(16px,2.2vw,19px);color:var(--ink-soft);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line-strong);background:var(--tape);color:var(--tape-ink);font-family:var(--font-display);font-weight:600;font-size:18px;padding:11px 22px;border-radius:16px;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mt{margin-top:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.speak{border:0;background:transparent;font-size:16px;padding:2px 4px;border-radius:6px;line-height:1}
.speak:hover{background:var(--paper-2)}
.no-tts .speak{display:none}

/* option buttons */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:14px 12px;text-align:center;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--mint)}
.opt svg{width:58px;height:58px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.opt.gone{opacity:.32;text-decoration:line-through}
.opt:disabled{cursor:default}
.opt.right:disabled{opacity:1}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{border-radius:16px;padding:14px 16px;margin-top:16px;border:2px solid var(--good);background:var(--good-bg)}
.feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
.qcount{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}

/* ---------- title scene ---------- */
.scene-wrap{border:2px solid var(--line);border-radius:28px;overflow:hidden;background:var(--scene-wall);box-shadow:0 6px 0 var(--line)}
.scene-wrap svg{display:block;width:100%;height:auto}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.level-tile{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px}
.level-tile b{font-family:var(--font-display);font-weight:600;font-size:19px;display:block}
.level-tile .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--mint);color:#08302A;font-weight:700;font-size:14px;margin-bottom:6px}
.bub{animation:rise 3.2s ease-in infinite}
.bub:nth-of-type(2){animation-delay:1s}.bub:nth-of-type(3){animation-delay:2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-46px);opacity:0}}

/* ---------- team builder ---------- */
.pick{border:2px solid var(--line);background:var(--paper);border-radius:22px;padding:12px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s,transform .12s}
.pick:hover{border-color:var(--mint)}
.pick.sel{border-color:var(--line-strong);background:var(--paper-2);box-shadow:0 4px 0 var(--line-strong)}
.pick .av{width:100%;max-width:120px;aspect-ratio:120/140;border-radius:18px;background:var(--scene-wall)}
.pick .av.h{aspect-ratio:1}
.pick b{font-family:var(--font-display);font-weight:600;font-size:18px}
.pick .traits{font-size:13px;color:var(--ink-soft)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;font-weight:700;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.name-in{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 14px;font-size:18px;width:min(320px,100%)}
.spark-card{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--paper-2);border:2px dashed var(--line-strong);border-radius:24px;padding:16px 20px}
.spark-card svg.duo{width:110px;height:auto}
.spark-mid{text-align:center}
.spark-mid .team{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3.4vw,30px)}
.spark-mid .badge{display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px;margin-bottom:6px}
.spark-mid .badge.good{background:var(--mint);color:#08302A}

/* ---------- level 1 ---------- */
.sample{border:2px solid var(--line);background:var(--paper);border-radius:22px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.sample svg{width:96px;height:96px}
.sample b{font-family:var(--font-display);font-weight:600;font-size:20px}
.sample.sel{border-color:var(--line-strong);box-shadow:0 4px 0 var(--line-strong)}
.sample .tick{position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--mint);color:#08302A;font-size:14px;display:grid;place-items:center;font-weight:700}
.info{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.info svg{width:150px;height:150px}
.uses{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.use{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px}
.fact{border-left:5px solid var(--tape);background:var(--paper-2);padding:10px 14px;border-radius:4px 14px 14px 4px;font-size:15px}
.prompt{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:18px}
.prompt .vis{width:110px;height:110px;border-radius:22px;background:var(--scene-wall);display:grid;place-items:center;font-size:62px}
.prompt .vis svg{width:96px;height:96px}
.prompt .q{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,3vw,26px);line-height:1.3}

/* ---------- level 2 ---------- */
.rig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--scene-wall);border-radius:20px;padding:14px;border:2px solid var(--line)}
.slot{background:var(--paper);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:200px;justify-content:space-between}
.slot svg.res{width:100%;max-width:130px;height:96px}
.slot .val{font-weight:700;font-size:15px}
.slot .mini{width:44px;height:44px}
.slot .btn{font-size:15px;padding:7px 14px}
.report{margin-top:18px}
.report-line{font-family:var(--font-display);font-size:clamp(20px,3vw,26px);font-weight:500;margin:6px 0 14px}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);text-align:center;color:var(--coral);font-weight:600;padding:0 6px}
.form-q{font-size:15px;color:var(--ink-soft);margin-bottom:8px}
.form-q b{color:var(--ink);font-size:17px}
.shelf{display:flex;gap:8px;flex-wrap:wrap}
.adj{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 8px 5px 12px;font-weight:700;font-size:15px}
.adj .m{width:12px;height:12px;border-radius:50%}
.adj.locked{opacity:.4;border-style:dashed}
.adj.on{background:var(--tape);border-color:var(--line-strong);color:var(--tape-ink)}
.adj.on .zh{color:var(--tape-ink)}

/* ---------- level 3 ---------- */
.ticket{border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;position:relative}
.ticket .cl{font-size:34px;width:54px;height:54px;border-radius:50%;background:var(--scene-wall);display:grid;place-items:center;flex:none}
.ticket b{font-family:var(--font-display);font-weight:600;font-size:17px;display:block}
.ticket small{color:var(--ink-soft);font-size:13px}
.ticket.sel{border-color:var(--line-strong);box-shadow:0 4px 0 var(--line-strong)}
.stamp{position:absolute;top:-10px;right:-6px;background:var(--good);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;padding:3px 10px;border-radius:8px;transform:rotate(6deg)}
.brief{font-family:var(--font-display);font-weight:500;font-size:clamp(18px,2.6vw,22px);background:var(--paper-2);border-radius:18px;padding:14px 18px;position:relative;margin:4px 0 14px}
.need{font-size:15px;color:var(--ink-soft);margin-bottom:16px}
.studio{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
.preview{background:var(--scene-wall);border:2px solid var(--line);border-radius:24px;padding:16px;text-align:center;position:sticky;top:12px}
.preview svg{width:100%;max-width:330px;height:auto}
.preview .pname{font-family:var(--font-display);font-weight:700;font-size:26px;min-height:1.2em}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);position:relative}
.sw.sel{box-shadow:0 0 0 3px var(--line-strong)}
.sw span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pat{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pat svg{width:100%;height:38px;border-radius:8px}
.pat.sel{border-color:var(--line-strong);box-shadow:0 3px 0 var(--line-strong)}
.pat .star{position:absolute;top:-8px;right:-4px;background:var(--coral);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px}
.field-label{font-family:var(--font-display);font-weight:600;font-size:18px;margin:18px 0 8px;display:block}
.field-label:first-child{margin-top:0}

/* sentence scaffold */
.bank{display:flex;gap:8px;flex-wrap:wrap;background:var(--paper-2);border:2px dashed var(--line);border-radius:18px;padding:12px}
.bank .k{font-size:12px;color:var(--ink-soft);display:block}
.bank .item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px}
.frames{margin:0;padding:0;list-style:none;counter-reset:f}
.frames li{counter-increment:f;display:grid;grid-template-columns:36px 1fr;gap:10px;padding:14px 0;border-bottom:2px dashed var(--line);font-size:18px;line-height:2.3}
.frames li:last-child{border-bottom:0}
.frames li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;margin-top:6px}
.slotin{border:0;border-bottom:3px solid var(--ink-soft);background:var(--paper-2);border-radius:8px 8px 0 0;padding:2px 8px;font-size:17px;font-weight:700;min-width:7ch;max-width:100%}
.slotin.ok{border-bottom-color:var(--good);background:var(--good-bg)}
.slotin.no{border-bottom-color:var(--bad);background:var(--bad-bg)}
.slotin::placeholder{color:var(--ink-soft);font-weight:400;opacity:.8}

/* final card */
.final{background:var(--paper);border:3px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 7px 0 var(--line-strong)}
.final-head{background:var(--ink);color:var(--paper);padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.final-head .duo{display:flex}
.final-head .duo svg{width:62px;height:62px;background:var(--paper);border-radius:50%;border:3px solid var(--tape)}
.final-head .duo svg + svg{margin-left:-14px}
.final-head h2{font-size:24px}
.final-head small{opacity:.8;font-size:13px;display:block}
.final-body{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:22px}
.final-body .pv{align-self:start;background:var(--scene-wall);border-radius:20px;padding:10px;text-align:center}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-bottom:14px}
.facts dt{color:var(--ink-soft)}
.facts dd{margin:0;font-weight:700}
.pitch{margin:0;padding-left:24px}
.pitch li{margin-bottom:9px;font-size:17px}
.pitch li em{font-style:normal;font-weight:700;background:linear-gradient(transparent 62%,#FFC93C88 0)}
.copy-note{font-size:14px;color:var(--ink-soft);border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}

/* modal */
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:var(--paper);border-radius:22px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.modal img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;border:2px solid var(--line)}

/* ---------- dialogue dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{max-width:1080px;margin:0 auto;background:var(--paper);border:2px solid var(--line-strong);border-radius:24px;box-shadow:0 -2px 0 var(--line),0 10px 30px #0003;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;pointer-events:auto}
.who{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
.who svg{width:62px;height:62px;background:var(--scene-wall);border-radius:50%}
.say{background:var(--paper-2);border:2px solid var(--line);border-radius:16px;padding:7px 11px;font-size:15px;line-height:1.35;position:relative;min-height:46px}
.say b{display:block;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-soft)}
.say::before{content:"";position:absolute;left:-9px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.say.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:150px}
.meter{width:150px}
.meter .lbl{font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.meter .trk{height:12px;border-radius:999px;background:var(--paper-2);border:2px solid var(--line);overflow:hidden}

  return `<svg class="res" viewBox="0 0 130 96" aria-hidden="true"><rect x="8" y="40" width="14" height="44" rx="4" fill="#6C8A9C"/><rect x="108" y="40" width="14" height="44" rx="4" fill="#6C8A9C"/><path d="M14 40 Q65 ${40+bend*1.6} 116 40" stroke="${METALS[k].dot}" stroke-width="9" fill="none" stroke-linecap="round"/><rect x="50" y="${8+bend*0.8}" width="30" height="22" rx="5" fill="#17414A"/><text x="65" y="${23+bend*0.8}" text-anchor="middle" font-size="10" font-weight="700" fill="#FFC93C">kg</text></svg>`;
}

/* ================= SOUND & SPEECH ================= */
let soundOn=true,ac=null;
function sfx(kind){
  if(!soundOn)return;
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=ac||new A();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,notes={ok:[523,659,784],no:[330,262],win:[523,659,784,1047],tap:[880]}[kind]||[600];
    notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),a=t+i*.1;o.type=kind==='no'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.08,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+.16);o.connect(g).connect(ac.destination);o.start(a);o.stop(a+.18);});
  }catch(e){}
}
let tts=null,dl=null;
const hasSynth='speechSynthesis' in window;
function say(text){
  if(tts){tts.speak(text,{language:'en',voice:'airy'}).catch(()=>synthSay(text));return;}
  synthSay(text);
}
function synthSay(text){try{if(!hasSynth)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const spk=t=>`<button class="speak" type="button" data-say="${esc(t)}" aria-label="Listen: ${esc(t)}">🔈</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();e.stopPropagation();say(b.dataset.say);}},true);
if(!hasSynth)document.documentElement.classList.add('no-tts');
(async()=>{try{if(window.claude&&window.claude.use){
  const [t,d]=await Promise.all([window.claude.use('tts').catch(()=>null),window.claude.use('downloads').catch(()=>null)]);
  tts=t;dl=d;if(tts)document.documentElement.classList.remove('no-tts');
}}catch(e){}})();

function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=$('#sparkFill').getBoundingClientRect();
  for(let i=0;i<6;i++){const s=document.createElement('span');s.className='burst';s.textContent=pick(['✦','✧','⚡','★']);
    s.style.left=(r.right-6)+'px';s.style.top=(r.top-10)+'px';s.style.color=pick(['#FFC93C','#FF6F61','#2EC4A6']);
    s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--dy',(-40-Math.random()*70)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);}
}

/* generic single-answer question */
function ask(el,opts,correct,onDone){
  let missed=false,done=false;
  el.innerHTML=opts.map(o=>`<button type="button" class="opt" data-v="${esc(o.v)}">${o.html}</button>`).join('');
  const btns=[...el.querySelectorAll('.opt')];
  btns.forEach(b=>b.addEventListener('click',()=>{
    if(done||b.disabled)return;
    if(b.dataset.v===correct){
      done=true;b.classList.add('right');btns.forEach(x=>x.disabled=true);
      addSpark(missed?1:4);sfx('ok');react('correct');setHint(null);onDone(missed);
    }else{missed=true;b.classList.add('wrong');b.disabled=true;sfx('no');react('wrong');}
  }));
  setHint(()=>{
    const w=btns.filter(x=>!x.disabled&&x.dataset.v!==correct);
    if(!w.length){talk(null,pick(H().lines.nohint));return;}
    const g=pick(w);g.disabled=true;g.classList.add('gone');missed=true;
    talk(pick(D().lines.think),pick(H().lines.hint));sfx('tap');
  });
}

function frameDefs(){
  const L=S.l3,p=PRODUCTS.find(x=>x.id===L.product),m=p.material,mAcc=m==='aluminum'?['aluminum','aluminium']:[m];
  const patWord=L.pattern;
  const A=a=>v=>a.includes(norm(v));
  const FREE=v=>norm(v).split(' ').filter(Boolean).length>=2;
  const ADJ=v=>p.adjs.includes(norm(v));
  return {p,frames:[
    ['Our product is a ',{k:'type',ph:'product type',t:A(p.accept)},' called the ',{k:'pname',ph:'product name',t:v=>norm(v)===norm(L.pname)},'. It is designed to ',{k:'purpose',ph:'what it does',t:FREE,free:1},'.'],
    ['To work well, it needs a material that is ',{k:'adjA',ph:'adjective',t:ADJ},' and ',{k:'adjB',ph:'adjective',t:ADJ},'.'],
    ['We decided to use ',{k:'mat1',ph:'material',t:A(mAcc)},' because it is ',{k:'adjC',ph:'adjective',t:ADJ},'.'],
    ['One important property of ',{k:'mat2',ph:'material',t:A(mAcc)},' is that it is ',{k:'adjD',ph:'adjective',t:ADJ},', which helps the product ',{k:'benefit',ph:'do what?',t:FREE,free:1},'.'],
    ['We chose a ',{k:'color',ph:'color',t:A([L.color])},' color with a ',{k:'pattern',ph:'pattern',t:A([patWord,patWord.replace('-',' '),patWord.replace('-','')])},' pattern because ',{k:'why',ph:'your reason',t:FREE,free:1},'.'],
    ['We believe ',{k:'mat3',ph:'material',t:A(mAcc)},' is a good choice because its properties meet the needs of our product.']
  ]};
}

function svgImg(svg){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function rr(c,x,y,w,h,r,fill,stroke){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=4;c.stroke();}}
function wrap(c,txt,x,y,maxW,lh){const words=txt.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,y);y+=lh;line=w;}else line=t;}if(line){c.fillText(line,x,y);y+=lh;}return y;}
async function makePNG(){
  const st=$('#fstat');st.textContent='Making your picture…';

  c0.font='400 29px "Atkinson Hyperlegible", sans-serif';
  let est=0;S.sentences.forEach(s=>{let line='',n=1;for(const w of sentText(s).split(' ')){const t=line?line+' '+w:w;if(c0.measureText(t).width>840&&line){n++;line=w;}else line=t;}est+=n*40+18;});
  const W=1080,Hh=Math.max(1100,815+est+120),cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const c=cv.getContext('2d');
  c.fillStyle='#E4F4F0';c.fillRect(0,0,W,Hh);c.strokeStyle='#CFE8E2';c.lineWidth=2;
  for(let x=0;x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,Hh);c.stroke();}for(let y=0;y<Hh;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  rr(c,40,40,W-80,Hh-80,40,'#FFFFFF','#17414A');
  rr(c,40,40,W-80,170,40,'#17414A');c.fillStyle='#17414A';c.fillRect(40,150,W-80,60);
  const [pi,di,hi]=await Promise.all([svgImg(productSVG(p.id,hex,L.pattern)),svgImg(designerSVG(d)),svgImg(helperSVG(h))]);
  c.fillStyle='#FFFFFF';c.beginPath();c.arc(130,125,56,0,7);c.fill();c.beginPath();c.arc(210,125,56,0,7);c.fill();
  if(di)c.drawImage(di,84,72,92,107);if(hi)c.drawImage(hi,162,77,96,96);
  c.fillStyle='#FFFFFF';c.font='700 54px Fredoka, sans-serif';c.fillText(L.pname,290,122);
  c.fillStyle='#FFC93C';c.font='500 26px Fredoka, sans-serif';c.fillText(`by ${nm()} & ${h.name} · Team ${d.teamWord} ${h.teamWord}`,290,165);
  rr(c,80,250,400,380,30,'#E4F4F0');if(pi)c.drawImage(pi,100,280,360,330);
  c.fillStyle='#4E6E74';c.font='700 24px "Atkinson Hyperlegible", sans-serif';
  const facts=[['Product',p.title],['Client',p.clientName],['Material',METALS[p.material].name],['Because it is',p.adjs.join(' + ')],['Style',`${L.color}, ${L.pattern} pattern`],['Team spark',`${S.spark} · ${sparkTitle()}`]];
  let fy=290;facts.forEach(([k,v])=>{c.fillStyle='#4E6E74';c.font='400 22px "Atkinson Hyperlegible", sans-serif';c.fillText(k,520,fy);c.fillStyle='#17414A';c.font='700 28px "Atkinson Hyperlegible", sans-serif';c.fillText(v,520,fy+34);fy+=64;});
  c.fillStyle='#FFC93C';rr(c,80,700,240,50,10,'#FFC93C');c.fillStyle='#3B2A05';c.font='600 28px Fredoka, sans-serif';c.fillText('My pitch',104,735);
  let y=815;c.font='400 29px "Atkinson Hyperlegible", sans-serif';c.fillStyle='#17414A';
  S.sentences.forEach((s,i)=>{c.fillStyle='#17414A';c.beginPath();c.arc(102,y-10,20,0,7);c.fill();c.fillStyle='#fff';c.font='700 22px "Atkinson Hyperlegible", sans-serif';c.fillText(String(i+1),95,y-2);
    c.fillStyle='#17414A';c.font='400 29px "Atkinson Hyperlegible", sans-serif';y=wrap(c,sentText(s),140,y,W-240,40)+18;});
  c.fillStyle='#4E6E74';c.font='400 22px "Atkinson Hyperlegible", sans-serif';c.fillText('Metal Lab · Design Studio',80,Hh-80);
  const url=cv.toDataURL('image/png');
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" role="dialog" aria-label="Your design card picture"><img src="${url}" alt="Design card for ${esc(L.pname)}"><p style="font-size:14px;color:var(--ink-soft);margin:10px 0">${dl?'Tap Save to keep this picture.':'Tap Download picture. If nothing happens, long-press (phone) or right-click (computer) the picture to save it.'}</p><div class="row" style="justify-content:center">${dl?'<button class="btn" id="mSave">Save</button>':`<a class="btn" style="text-decoration:none" href="${url}" download="Metal-Lab-${(L.pname||'design').replace(/[^\w-]+/g,'-')}.png">Download picture</a>`}<button class="btn alt" id="mClose">Close</button></div><p id="mStat" style="font-size:13px;margin:8px 0 0"></p></div>`;
  document.body.appendChild(m);st.textContent='';
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  $('#mClose').onclick=()=>m.remove();
  if(dl)$('#mSave').onclick=async()=>{
    try{const blob=await (await fetch(url)).blob();
      await dl.save({filename:`Metal-Lab-${(L.pname||'design').replace(/[^\w-]+/g,'-')}.png`,data:blob});$('#mStat').textContent='Saved!';}
    catch(e){$('#mStat').textContent=e&&e.code==='declined'?'Not saved.':'Saving isn’t available here. Long-press or right-click the picture instead.';}
  };
}

/* ================= TOOLS ================= */
$('#zhBtn').onclick=e=>{const on=document.documentElement.classList.toggle('no-zh');e.currentTarget.setAttribute('aria-pressed',String(!on));};
$('#sndBtn').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Sound':'🔇 Sound';e.currentTarget.setAttribute('aria-pressed',String(soundOn));};
let armed=null;
$('#resetBtn').onclick=e=>{const b=e.currentTarget;
  if(S.screen!=='title'&&!armed){b.textContent='Tap again to restart';armed=setTimeout(()=>{armed=null;b.textContent='↺ Restart';},3000);return;}
  clearTimeout(armed);armed=null;b.textContent='↺ Restart';S=fresh();go('title');};
go('title');
})();
</script>
